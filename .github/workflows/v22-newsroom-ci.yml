name: V22 Newsroom CI

on:
  push:
    branches: [v22-ai-newsroom]
    paths:
      - 'src/**'
      - 'colab/**'
      - 'tests/**'
      - '.github/workflows/v22-newsroom-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'colab/**'
      - 'tests/**'
      - '.github/workflows/v22-newsroom-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: V22 smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic newsroom tests
        run: node tests/v22-newsroom-smoke.mjs
      - name: Validate notebook JSON
        run: node -e "JSON.parse(require('fs').readFileSync('colab/90gundem_v22_ai_newsroom.ipynb','utf8')); console.log('V22 notebook JSON OK')"
